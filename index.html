<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 06 Final Project — Grading Rubric</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, 'Times New Roman', serif; background: #FDF0F5; min-height: 100vh; padding: 24px; }
.wrap { max-width: 780px; margin: 0 auto; }
.hdr { background: #72243E; border-radius: 12px; padding: 20px 24px; margin-bottom: 14px; }
.hdr h1 { font-size: 20px; font-weight: 700; color: #FBEAF0; margin-bottom: 4px; font-family: Georgia, serif; }
.hdr p { font-size: 13px; color: #ED93B1; font-family: sans-serif; }
.gcard { background: #fff; border: 1px solid #F4C0D1; border-radius: 12px; padding: 16px 20px; margin-bottom: 14px; }
.gcard-title { font-size: 13px; font-weight: 700; color: #72243E; margin-bottom: 12px; font-family: sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
.gfields { display: grid; grid-template-columns: 140px 1fr; gap: 10px; align-items: start; }
.gfields label { font-size: 12px; color: #999; padding-top: 8px; font-family: sans-serif; }
.gfields input, .gfields textarea { border: 1px solid #ED93B1; border-radius: 8px; padding: 7px 10px; font-size: 13px; color: #333; background: #FDF5F8; width: 100%; font-family: sans-serif; }
.gfields textarea { resize: none; line-height: 1.5; }
.toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
.btn-reset { font-size: 13px; color: #993556; background: #FBEAF0; border: 1px solid #ED93B1; border-radius: 8px; padding: 7px 16px; cursor: pointer; font-family: sans-serif; }
.btn-reset:hover { background: #F4C0D1; }
.btn-export { font-size: 13px; color: #fff; background: #993556; border: none; border-radius: 8px; padding: 7px 18px; cursor: pointer; font-family: sans-serif; font-weight: 600; }
.btn-export:hover { background: #72243E; }
.btn-export:disabled { opacity: 0.6; cursor: not-allowed; }
.sec { background: #fff; border: 1px solid #F4C0D1; border-radius: 12px; padding: 14px 18px; margin-bottom: 12px; }
.sec.is-sim { background: #FBEAF0; border: 2px solid #D4537E; }
.sec-hdr { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #F4C0D1; padding-bottom: 10px; margin-bottom: 10px; }
.sec-title { font-size: 14px; font-weight: 700; color: #72243E; font-family: sans-serif; }
.is-sim .sec-title { color: #4B1528; }
.sec-score { font-size: 12px; font-weight: 700; background: #FBEAF0; color: #993556; border-radius: 99px; padding: 3px 11px; font-family: sans-serif; white-space: nowrap; }
.sublabel { font-size: 10px; font-weight: 700; color: #993556; text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 0 4px; border-top: 1px solid #F4C0D1; margin-top: 4px; font-family: sans-serif; }
.sublabel:first-child { border-top: none; padding-top: 0; margin-top: 0; }
.row { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; border-top: 1px solid #FDF0F5; }
.row input[type=checkbox] { margin-top: 3px; flex-shrink: 0; accent-color: #993556; width: 15px; height: 15px; cursor: pointer; }
.row label { font-size: 13px; color: #333; flex: 1; line-height: 1.55; cursor: pointer; font-family: sans-serif; }
.row .ni { width: 52px; border: 1px solid #ED93B1; border-radius: 7px; padding: 3px 6px; font-size: 13px; color: #72243E; background: #FDF5F8; text-align: right; flex-shrink: 0; font-family: sans-serif; }
.row .mx { font-size: 12px; color: #D4537E; padding-top: 4px; min-width: 32px; text-align: right; flex-shrink: 0; font-family: sans-serif; }
.sim-badge { font-size: 10px; font-weight: 700; background: #D4537E; color: #fff; border-radius: 99px; padding: 2px 8px; margin-left: 7px; font-family: sans-serif; }
.scorebar { background: #4B1528; border-radius: 12px; padding: 16px 20px; margin-top: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.met { background: #72243E; border-radius: 8px; padding: 10px 14px; }
.met-lbl { font-size: 10px; color: #ED93B1; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; font-family: sans-serif; }
.met-val { font-size: 22px; font-weight: 700; color: #FBEAF0; font-family: sans-serif; }
.prog-wrap { background: #4B1528; border-radius: 99px; height: 4px; margin-top: 7px; overflow: hidden; }
.prog-bar { height: 100%; border-radius: 99px; background: #ED93B1; transition: width 0.2s; }
@media (max-width: 560px) {
  body { padding: 12px; }
  .scorebar { grid-template-columns: repeat(2, 1fr); }
  .gfields { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>Module 06 Final Project — Grading Rubric</h1>
    <p>Check items and enter partial points. Grade calculates automatically.</p>
  </div>

  <div class="gcard">
    <div class="gcard-title">Group Info</div>
    <div class="gfields">
      <label for="gnum">Group number</label>
      <input type="text" id="gnum" placeholder="e.g. Group 4">
      <label for="gnames">Member names</label>
      <textarea id="gnames" rows="3" placeholder="One name per line"></textarea>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn-reset" id="btn-reset">↺ Reset all</button>
    <button class="btn-export" id="btn-export">↓ Export PDF</button>
  </div>

  <div id="sections-container"></div>

  <div class="scorebar">
    <div class="met"><div class="met-lbl">Points earned</div><div class="met-val" id="s-earned">0</div></div>
    <div class="met"><div class="met-lbl">Total possible</div><div class="met-val" id="s-total">0</div></div>
    <div class="met"><div class="met-lbl">Percentage</div><div class="met-val" id="s-pct">0%</div><div class="prog-wrap"><div class="prog-bar" id="s-bar" style="width:0%"></div></div></div>
    <div class="met"><div class="met-lbl">Letter grade</div><div class="met-val" id="s-letter">—</div></div>
  </div>
</div>

<script>
var DATA = [
  {t:"Part 1 — Abstract", items:[
    {l:"Abstract present (~5 sentences)",pts:5},
    {l:"Clearly summarizes paper content and speculative artwork",pts:5}
  ]},
  {t:"Part 2 — Introduction", items:[
    {l:"Introduction present (5–8 sentences)",pts:5},
    {l:"Establishes topic, thesis, and connection to speculative artwork",pts:5}
  ]},
  {t:"Part 3 — Body paragraph 1", subs:[
    {sl:"Theme & thesis connection", items:[{l:"Clear theme stated and connected to thesis / speculative artwork",pts:6}]},
    {sl:"Article", items:[
      {l:"1 article referenced (peer-reviewed preferred)",pts:5},
      {l:"Article is from outside the field of art",pts:3},
      {l:"Article is meaningfully integrated, not just cited",pts:4}
    ]},
    {sl:"Artwork", items:[
      {l:"1 artwork from an outside artist discussed",pts:5},
      {l:"Artwork discussion connects to paragraph theme",pts:4},
      {l:"Digital media concept addressed through artwork",pts:4}
    ]},
    {sl:"Personal connection", items:[{l:"Personal / lived experience connection to theme",pts:4}]}
  ]},
  {t:"Part 3 — Body paragraph 2", subs:[
    {sl:"Theme & thesis connection", items:[{l:"Clear theme stated and connected to thesis / speculative artwork",pts:6}]},
    {sl:"Article", items:[
      {l:"1 article referenced (peer-reviewed preferred)",pts:5},
      {l:"Article is from outside the field of art",pts:3},
      {l:"Article is meaningfully integrated, not just cited",pts:4}
    ]},
    {sl:"Artwork", items:[
      {l:"1 artwork from an outside artist discussed",pts:5},
      {l:"Artwork discussion connects to paragraph theme",pts:4},
      {l:"Digital media concept addressed through artwork",pts:4}
    ]},
    {sl:"Personal connection", items:[{l:"Personal / lived experience connection to theme",pts:4}]}
  ]},
  {t:"Part 3 — Body paragraph 3", subs:[
    {sl:"Theme & thesis connection", items:[{l:"Clear theme stated and connected to thesis / speculative artwork",pts:6}]},
    {sl:"Article", items:[
      {l:"1 article referenced (at least 1 of the 3 total must be peer-reviewed)",pts:5},
      {l:"Article is from outside the field of art",pts:3},
      {l:"Article is meaningfully integrated, not just cited",pts:4}
    ]},
    {sl:"Artwork", items:[
      {l:"1 artwork from an outside artist discussed",pts:5},
      {l:"Artwork discussion connects to paragraph theme",pts:4},
      {l:"Digital media concept addressed through artwork",pts:4}
    ]},
    {sl:"Personal connection", items:[{l:"Personal / lived experience connection to theme",pts:4}]}
  ]},
  {t:"Part 3 — Body overall", items:[
    {l:"Word count within 1200–1400 range",pts:5},
    {l:"At least 2 of 3 articles are peer-reviewed",pts:5},
    {l:"At least 1 technology discussed across the body",pts:5},
    {l:"All 3 paragraphs build cohesively toward thesis / speculative artwork",pts:6}
  ]},
  {t:"Part 4 — Speculative artwork", items:[
    {l:"Artwork idea clearly described",pts:8},
    {l:"Visual representation included",pts:6},
    {l:"Artwork functions as thesis or quintessential example of paper's ideas",pts:8}
  ]},
  {t:"Part 5 — Conclusion", items:[
    {l:"Conclusion present (~5 sentences)",pts:5},
    {l:"Synthesizes ideas across all 3 body paragraphs",pts:5}
  ]},
  {t:"Part 6 — References", items:[
    {l:"References page included",pts:3},
    {l:"Correct citation format (ASA or Chicago) used consistently",pts:4},
    {l:"All in-text citations have corresponding references",pts:3}
  ]},
  {t:"Part 7 — Images (14 total)", items:[
    {l:"3 artworks from outside artists (1 per body paragraph)",pts:6},
    {l:"1 image of speculative artwork",pts:4},
    {l:"At least 10 concept sketches",pts:8}
  ]},
  {t:"Part 8 — Presentation", items:[
    {l:"Presentation submitted for each due date",pts:6},
    {l:"Template used / format followed",pts:3}
  ]},
  {t:"Part 9 — Speculative artwork stages", items:[
    {l:"P1: 1 sketch with title/description label",pts:4},
    {l:"P2: 3 sketches per member, each with title, sentence, and name",pts:6},
    {l:"P3: 3+ views in full color with labeled callouts",pts:8},
    {l:"P3: Note identifying which P2 sketches it developed from and why",pts:3},
    {l:"Final: Highest-quality render / draw / code / film",pts:8},
    {l:"Final: All elements labeled (title, medium, author)",pts:4},
    {l:"No AI-generated images, found photos, or unaltered screenshots in final",pts:5}
  ]},
  {t:"Simulation element", sim:true, subs:[
    {sl:"Type & execution", items:[
      {l:"Simulation element present (video, animation, code, sound, storyboard, or physical demo)",pts:5},
      {l:"Meets minimum duration / scope (30–90 sec video/audio, 3+ panels storyboard, etc.)",pts:4},
      {l:"Clearly shows how the artwork works or behaves over time",pts:4}
    ]},
    {sl:"Documentation", items:[
      {l:"One-sentence note explaining what the simulation reveals about the piece",pts:2}
    ]}
  ]}
];

var allRows = [];
var cont = document.getElementById('sections-container');

function letterGrade(p){
  if(p>=93)return'A'; if(p>=90)return'A−'; if(p>=87)return'B+';
  if(p>=83)return'B'; if(p>=80)return'B−'; if(p>=77)return'C+';
  if(p>=73)return'C'; if(p>=70)return'C−'; if(p>=67)return'D+';
  if(p>=60)return'D'; return'F';
}

function recalc(){
  var e=0,p=0;
  allRows.forEach(function(r){ p+=r.pts; var v=parseFloat(r.ni.value)||0; e+=Math.min(v,r.pts); });
  var pct=p>0?Math.round(e/p*100):0;
  document.getElementById('s-earned').textContent=e.toFixed(1);
  document.getElementById('s-total').textContent=p;
  document.getElementById('s-pct').textContent=pct+'%';
  document.getElementById('s-bar').style.width=pct+'%';
  document.getElementById('s-letter').textContent=p>0?letterGrade(pct):'—';
}

function updateSec(scoreEl, secRows){
  var e=0,p=0;
  secRows.forEach(function(r){ p+=r.pts; var v=parseFloat(r.ni.value)||0; e+=Math.min(v,r.pts); });
  scoreEl.textContent=e.toFixed(1)+' / '+p+' pts';
}

function makeRow(item, secRows, scoreEl){
  var id='r'+allRows.length;
  var div=document.createElement('div');
  div.className='row';
  var cb=document.createElement('input'); cb.type='checkbox'; cb.id=id;
  var lbl=document.createElement('label'); lbl.htmlFor=id; lbl.textContent=item.l;
  var ni=document.createElement('input'); ni.type='number'; ni.className='ni';
  ni.min=0; ni.max=item.pts; ni.step=0.5; ni.value=0;
  var mx=document.createElement('span'); mx.className='mx'; mx.textContent='/ '+item.pts;
  var entry={pts:item.pts,ni:ni,cb:cb,label:item.l};
  allRows.push(entry); secRows.push(entry);
  cb.addEventListener('change',function(){ ni.value=cb.checked?item.pts:0; updateSec(scoreEl,secRows); recalc(); });
  ni.addEventListener('input',function(){ cb.checked=(parseFloat(ni.value)||0)>=item.pts; updateSec(scoreEl,secRows); recalc(); });
  div.appendChild(cb); div.appendChild(lbl); div.appendChild(ni); div.appendChild(mx);
  return div;
}

DATA.forEach(function(sec){
  var allItems=[];
  if(sec.subs){ sec.subs.forEach(function(s){ s.items.forEach(function(i){ allItems.push(i); }); }); }
  else{ allItems=sec.items; }
  var secMax=allItems.reduce(function(a,i){return a+i.pts;},0);

  var secDiv=document.createElement('div');
  secDiv.className='sec'+(sec.sim?' is-sim':'');

  var hdr=document.createElement('div'); hdr.className='sec-hdr';
  var titleSpan=document.createElement('span'); titleSpan.className='sec-title';
  if(sec.sim){
    titleSpan.textContent=sec.t+' ';
    var badge=document.createElement('span'); badge.className='sim-badge'; badge.textContent='15 pts';
    titleSpan.appendChild(badge);
  } else { titleSpan.textContent=sec.t; }

  var scoreSpan=document.createElement('span'); scoreSpan.className='sec-score';
  scoreSpan.textContent='0 / '+secMax+' pts';
  hdr.appendChild(titleSpan); hdr.appendChild(scoreSpan);
  secDiv.appendChild(hdr);

  var secRows=[];
  if(sec.subs){
    sec.subs.forEach(function(sub){
      var sl=document.createElement('div'); sl.className='sublabel'; sl.textContent=sub.sl;
      secDiv.appendChild(sl);
      sub.items.forEach(function(item){ secDiv.appendChild(makeRow(item,secRows,scoreSpan)); });
    });
  } else {
    sec.items.forEach(function(item){ secDiv.appendChild(makeRow(item,secRows,scoreSpan)); });
  }
  cont.appendChild(secDiv);
});

recalc();

document.getElementById('btn-reset').addEventListener('click',function(){
  allRows.forEach(function(r){ r.ni.value=0; r.cb.checked=false; });
  document.querySelectorAll('.sec-score').forEach(function(el){
    var parts=el.textContent.split('/');
    if(parts[1]) el.textContent='0 / '+parts[1].trim();
  });
  document.getElementById('gnum').value='';
  document.getElementById('gnames').value='';
  recalc();
});

document.getElementById('btn-export').addEventListener('click',function(){
  var btn=document.getElementById('btn-export');
  btn.disabled=true; btn.textContent='Generating...';
  try{
    var jsPDF=window.jspdf.jsPDF;
    var doc=new jsPDF({unit:'pt',format:'letter'});
    var pw=doc.internal.pageSize.getWidth();
    var ph=doc.internal.pageSize.getHeight();
    var ml=36, cw=pw-72, y=36;

    function np(h){ if(y+h>ph-36){ doc.addPage(); y=36; } }
    function rr(x,ry,w,h,fill,stroke){
      if(fill) doc.setFillColor(fill[0],fill[1],fill[2]);
      if(stroke) doc.setDrawColor(stroke[0],stroke[1],stroke[2]);
      doc.roundedRect(x,ry,w,h,3,3,fill&&stroke?'FD':fill?'F':'D');
    }

    var gnum=document.getElementById('gnum').value.trim();
    var gnames=document.getElementById('gnames').value.trim();
    var hh=(gnum||gnames)?72:50;
    np(hh);
    rr(ml,y,cw,hh,[114,36,62],null);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(251,234,240);
    doc.text('Module 06 Final Project — Grading Rubric',ml+12,y+18);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(237,147,177);
    var gy=y+32;
    if(gnum){ doc.text('Group: '+gnum,ml+12,gy); gy+=13; }
    if(gnames){
      var ns=gnames.split('\n').filter(Boolean).join('  |  ');
      var nlines=doc.splitTextToSize('Members: '+ns,cw-24);
      nlines.forEach(function(ln){ doc.text(ln,ml+12,gy); gy+=12; });
    }
    y+=hh+10;

    var ri=0;
    DATA.forEach(function(sec){
      var allItems=[];
      if(sec.subs){ sec.subs.forEach(function(s){ s.items.forEach(function(i){ allItems.push({item:i,sl:s.sl}); }); }); }
      else{ sec.items.forEach(function(i){ allItems.push({item:i,sl:null}); }); }
      var secMax=allItems.reduce(function(a,x){return a+x.item.pts;},0);
      var secEarned=0;
      for(var k=0;k<allItems.length;k++){ var v=parseFloat(allRows[ri+k].ni.value)||0; secEarned+=Math.min(v,allItems[k].item.pts); }

      np(26);
      rr(ml,y,cw,20,sec.sim?[75,21,40]:[114,36,62],null);
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(251,234,240);
      doc.text(sec.sim?sec.t+' [15 pts]':sec.t, ml+8, y+14);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(237,147,177);
      doc.text(secEarned.toFixed(1)+' / '+secMax+' pts', ml+cw-6, y+14, {align:'right'});
      y+=22;

      var lastSl=null;
      allItems.forEach(function(entry){
        var item=entry.item; var sl=entry.sl;
        var row=allRows[ri++];
        var earned=parseFloat(row.ni.value)||0;
        var checked=earned>=item.pts;

        if(sl&&sl!==lastSl){
          np(14);
          doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(153,53,86);
          doc.text(sl.toUpperCase(),ml+8,y+10);
          y+=13; lastSl=sl;
        }

        doc.setFontSize(8.5);
        var lines=doc.splitTextToSize(item.l,cw-68);
        var rh=Math.max(16,lines.length*11+6);
        np(rh+2);

        rr(ml,y,cw,rh,[251,234,240],[244,192,209]);
        doc.setFillColor(checked?153:255,checked?53:255,checked?86:255);
        doc.setDrawColor(212,83,126);
        doc.roundedRect(ml+6,y+rh/2-4.5,9,9,1.5,1.5,checked?'F':'D');
        if(checked){
          doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(255,255,255);
          doc.text('v',ml+8.5,y+rh/2+3);
        }
        doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(30,30,30);
        lines.forEach(function(ln,i){ doc.text(ln,ml+20,y+10+i*11); });
        doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(153,53,86);
        doc.text(earned+' / '+item.pts, ml+cw-5, y+rh/2+3, {align:'right'});
        y+=rh+2;
      });
      y+=6;
    });

    var te=0,tp=0;
    allRows.forEach(function(r){ tp+=r.pts; var v=parseFloat(r.ni.value)||0; te+=Math.min(v,r.pts); });
    var pct=tp>0?Math.round(te/tp*100):0;
    np(54);
    rr(ml,y,cw,48,[75,21,40],null);
    var cols=[['POINTS EARNED',te.toFixed(1)],['TOTAL POSSIBLE',''+tp],['PERCENTAGE',pct+'%'],['LETTER GRADE',letterGrade(pct)]];
    var qw=cw/4;
    cols.forEach(function(c,i){
      var cx=ml+i*qw+qw/2;
      doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(237,147,177);
      doc.text(c[0],cx,y+14,{align:'center'});
      doc.setFontSize(15); doc.setTextColor(251,234,240);
      doc.text(c[1],cx,y+36,{align:'center'});
    });

    var fn=gnum?'rubric-'+gnum.replace(/\s+/g,'-')+'.pdf':'module06-rubric.pdf';
    doc.save(fn);
  } catch(err){ alert('Export error: '+err.message); }
  btn.disabled=false; btn.textContent='↓ Export PDF';
});
</script>
</body>
</html>
